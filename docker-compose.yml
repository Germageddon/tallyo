services:
  tallyo:
    build: .
    container_name: tallyo-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - tallyo-data:/app/data
    # No published ports: the bot uses Telegram long-polling (outbound only),
    # so it can't collide with anything else running on the host.

volumes:
  tallyo-data:
